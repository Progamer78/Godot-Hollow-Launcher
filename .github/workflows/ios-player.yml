name: Build native Godot Player

on:
  workflow_dispatch:
    inputs:
      spine_runtime:
        description: 'Bundled Spine version (must match game assets; separate Spine Runtimes license applies)'
        type: choice
        default: '4.2'
        options: ['4.2', '4.1', '4.3', 'none']
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  export-and-build:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      SPINE_RUNTIME: ${{ inputs.spine_runtime || '4.2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup matching official Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: true
      - name: Export Xcode project using the working reference pipeline
        run: |
          set -o pipefail
          mkdir -p build/ios
          godot --headless --path bootstrap --editor --import 2>&1 | tee build/bootstrap-import.log
          godot --headless --path bootstrap --export-release iOS "$PWD/build/ios/player.xcodeproj" \
            2>&1 | tee build/ios-export.log
          test -f build/ios/player.xcodeproj/project.pbxproj
          test -f build/ios/player.xcframework/ios-arm64/libgodot.a
      - name: Checkout official engine release
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ed1daf0bf001b61586d9930840f2f1394092c079 # 4.7.2-stable
          path: .cache/godot-source
          persist-credentials: false
      - name: Select pinned Spine runtime source
        id: spine
        run: |
          python3 - <<'PY'
          import os
          from tools.prepare_spine import REVISIONS
          version = os.environ['SPINE_RUNTIME']
          if version not in REVISIONS:
              raise SystemExit('Unsupported Spine runtime selection')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('revision=' + REVISIONS[version] + '\n')
          print('Selected bundled Spine runtime:', version)
          PY
      - name: Checkout isolated Godot 3 runtime source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: a3378686f7196db78d7b3cc7947f72a13bc4864c # 3.6.3-stable
          path: .cache/godot3-source
          persist-credentials: false
      - name: Export and execute original Godot 3 proof
        run: python3 tools/desktop_proof3.py --download
      - name: Checkout official Spine module and C++ runtime
        if: env.SPINE_RUNTIME != 'none'
        uses: actions/checkout@v4
        with:
          repository: EsotericSoftware/spine-runtimes
          ref: ${{ steps.spine.outputs.revision }}
          path: .cache/spine-runtimes
          persist-credentials: false
          sparse-checkout: |
            spine-godot/spine_godot
            spine-cpp/spine-cpp
      - name: Stage bundled animation runtime
        run: python3 tools/prepare_spine.py .cache/godot-source .cache/spine-runtimes --version "$SPINE_RUNTIME"
      - name: Stage Godot 3 animation runtime
        run: python3 tools/prepare_spine.py .cache/godot3-source .cache/spine-runtimes --version "$SPINE_RUNTIME" --engine-major 3 --report build/spine3-build.json --notice build/SPINE3-RUNTIMES-LICENSE.txt
      - name: Checkout trusted LimboAI runtime source
        uses: actions/checkout@v4
        with:
          repository: limbonaut/limboai
          ref: e45e60e976dafab7f2c15cc341ae366e4cf3352b # v1.8.1 / Godot 4.7.2
          path: .cache/limboai
          persist-credentials: false
      - name: Export and execute two independent PCKs
        run: python3 tools/desktop_proof.py "$(command -v godot)"
      - name: Test native pack inspector
        run: |
          set -o pipefail
          swiftc -swift-version 5 ios/PCKInspector.swift tests/pck/main.swift -o build/pck-tests
          build/pck-tests build/proof/movement.pck build/proof/counter.pck build/godot3-proof/godot3.pck
          python3 tools/build_archive_support.py .cache/godot-source build/archive-tests
          python3 tools/package_fixtures.py
          swiftc -swift-version 5 -import-objc-header ios/ArchiveSupport.h ios/PCKInspector.swift ios/ControlProfile.swift ios/ToolModels.swift ios/PackageImport.swift ios/SaveVault.swift ios/GameLibrary.swift tests/models/main.swift -L build/archive-tests -lplayer_archive -Xlinker -lc++ -lz -o build/model-tests
          build/model-tests
          godot --headless --main-pack build/archive-tests/imported-apk.pck -- --player-proof 2>&1 | tee build/apk-proof.log
          python3 -c "from pathlib import Path; text=Path('build/apk-proof.log').read_text(); assert 'PLAYER_PROOF movement PASS' in text and not any(message in text for message in ['SCRIPT ERROR', 'Failed to load', 'Error opening', 'Couldn\x27t load project']), text"
          python3 -m unittest discover -s tests -v
      - name: Stage legacy script compatibility and built-in AI runtime
        run: python3 tools/prepare_compatibility.py .cache/godot-source .cache/limboai
      - name: Patch and verify player integration
        run: |
          python3 tools/patch_engine.py .cache/godot-source
          python3 - <<'PY'
          from pathlib import Path
          renderer = Path('.cache/godot-source/drivers/apple_embedded/godot_view_renderer.mm')
          if '#import "godot_view_controller.h"' not in renderer.read_text():
              raise SystemExit('Outdated patcher: replace tools/patch_engine.py. A copy at the repository root is not used by this workflow.')
          print('Controller header fix is present in the generated renderer.')
          PY
      - name: Type-check the complete iOS launcher before compiling Godot
        run: |
          set -o pipefail
          xcrun --sdk iphoneos swiftc -typecheck -parse-as-library \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -swift-version 5 -cxx-interoperability-mode=default \
            -module-name godot_swift_module -target arm64-apple-ios14.0 \
            -I .cache/godot-source \
            -import-objc-header .cache/godot-source/drivers/apple_embedded/bridging_header_apple_embedded.h \
            .cache/godot-source/drivers/apple_embedded/*.swift \
            2>&1 | tee build/ios-typecheck.log
      - name: Compile and link archive importer for iPhone before building engines
        run: |
          set -o pipefail
          python3 tools/check_ios_archive_link.py .cache/godot-source build/ios-archive-link \
            2>&1 | tee build/ios-archive-link.log
      - name: Exercise input views and keyboard in an iPhone simulator
        run: |
          set -o pipefail
          python3 tools/check_input_ui.py build/input-ui 2>&1 | tee build/input-ui.log
      - name: Compile isolated Godot 3 framework
        run: |
          set -o pipefail
          python3 tools/patch_godot3.py .cache/godot3-source
          python3 -m venv .cache/scons3-env
          .cache/scons3-env/bin/pip install scons==4.10.1
          cd .cache/godot3-source
          runtime3_flags=(platform=iphone target=release tools=no arch=arm64
            module_arkit_enabled=no module_camera_enabled=no module_gdnative_enabled=no
            lto=none optimize=size "CCFLAGS=-fvisibility=hidden -fvisibility-inlines-hidden"
            -j"$(sysctl -n hw.logicalcpu)")
          ../scons3-env/bin/scons "${runtime3_flags[@]}" platform/iphone/libiphone.iphone.opt.arm64.a \
            2>&1 | tee ../../build/godot3-adapter-build.log
          ../scons3-env/bin/scons "${runtime3_flags[@]}" 2>&1 | tee ../../build/godot3-build.log
          cd ../..
          python3 tools/build_godot3_framework.py .cache/godot3-source build/runtime3 \
            2>&1 | tee build/godot3-link.log
      - name: Compile ARM64 runtime with external main-pack support
        run: |
          set -o pipefail
          python3 -m venv .cache/scons-env
          .cache/scons-env/bin/pip install scons==4.10.1
          cd .cache/godot-source
          runtime_flags=(platform=ios target=template_release arch=arm64
            disable_path_overrides=no vulkan=no metal=yes opengl3=yes
            debug_symbols=no optimize=size -j"$(sysctl -n hw.logicalcpu)")
          ../scons-env/bin/scons "${runtime_flags[@]}" \
            bin/obj/modules/libmodule_player_tools.ios.template_release.arm64.a \
            bin/obj/modules/libmodule_limboai.ios.template_release.arm64.a \
            2>&1 | tee ../../build/compatibility-compile.log
          if [ "$SPINE_RUNTIME" != 'none' ]; then
            # Compile the new dependency first, reusing its objects below.
            ../scons-env/bin/scons "${runtime_flags[@]}" \
              bin/obj/modules/libmodule_spine_godot.ios.template_release.arm64.a \
              2>&1 | tee ../../build/spine-compile.log
          fi
          ../scons-env/bin/scons "${runtime_flags[@]}" 2>&1 | tee ../../build/runtime-build.log
      - name: Install player runtime into exported Xcode project
        run: |
          spine_notice=()
          if [ "$SPINE_RUNTIME" != 'none' ]; then
            spine_notice=(--spine-license build/SPINE-RUNTIMES-LICENSE.txt)
          fi
          python3 tools/prepare_xcode.py build/ios .cache/godot-source/bin/libgodot.ios.template_release.arm64.a "${spine_notice[@]}" --compatibility-license build/COMPATIBILITY-LICENSES.txt
      - name: Build Xcode archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project build/ios/player.xcodeproj \
            -scheme player -sdk iphoneos -configuration Release \
            -archivePath build/ios/player.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_STYLE=Manual DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" CODE_SIGN_ENTITLEMENTS="" \
            OTHER_CODE_SIGN_FLAGS="" 2>&1 | tee build/xcodebuild.log
      - name: Package IPA for personal signing
        run: |
          mkdir -p build/package/Payload
          cp -R build/ios/player.xcarchive/Products/Applications/*.app build/package/Payload/
          python3 tools/install_godot3_framework.py build/package/Payload build/runtime3/Godot3Runtime.framework
          cd build/package
          zip -qr ../GodotPlayer-unsigned.ipa Payload
          cd ../..
          python3 tools/audit_ipa.py build/GodotPlayer-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GodotPlayer-build-and-tests
          retention-days: 90
          path: |
            build/GodotPlayer-unsigned.ipa
            build/ipa-audit.json
            build/ios-archive-link/results.json
            build/input-ui/results.json
            build/input-ui/run.log
            build/*.log
            build/spine-build.json
            build/spine3-build.json
            build/compatibility-build.json
            build/COMPATIBILITY-LICENSES.txt
            build/SPINE-RUNTIMES-LICENSE.txt
            build/runtime3/godot3-framework.json
            build/godot3-proof/*.pck
            build/godot3-proof/*.json
            build/godot3-proof/*.log
            build/proof/*.pck
            build/proof/*.log
            build/proof/results.json
