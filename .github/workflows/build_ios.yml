name: Export and Build iOS IPA

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  export-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.0"
          use-dotnet: false
          include-templates: true

      - name: Verify Hollow Player Project
        run: |
          cd "$GITHUB_WORKSPACE/_hollow"
          echo "Current directory:"
          pwd
          echo
          echo "Project files:"
          ls -la
          echo
          echo "Checking required files:"
          test -f project.godot
          test -f launcher.tscn
          test -f launcher.gd
          test -f export_presets.cfg
          test -f icon.svg
          echo "All required files found."

      - name: Import Godot Project
        run: |
          cd "$GITHUB_WORKSPACE/_hollow"
          godot --headless --editor --quit

      - name: Export Xcode Project from Godot
        run: |
          cd "$GITHUB_WORKSPACE/_hollow"
          mkdir -p "$GITHUB_WORKSPACE/build/ios"

          godot --headless --verbose \
            --export-release "iOS" \
            "$GITHUB_WORKSPACE/build/ios/game.xcodeproj"

      - name: Verify Xcode Project
        run: |
          echo "Export directory:"
          ls -la "$GITHUB_WORKSPACE/build/ios"

          test -d "$GITHUB_WORKSPACE/build/ios/game.xcodeproj"

          echo "Xcode project successfully created."

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project "$GITHUB_WORKSPACE/build/ios/game.xcodeproj" \
            -scheme "game" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/ios/game.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS="" \
            OTHER_CODE_SIGN_FLAGS=""

      - name: Package into IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -r \
            "$GITHUB_WORKSPACE/build/ios/game.xcarchive/Products/Applications/"*.app \
            "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"
          zip -r game.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: game.ipa
